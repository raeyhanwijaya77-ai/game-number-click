<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sky War Jet</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  color: white;
  font-family: Arial;
}

#player {
  width: 50px;
  height: 50px;
  background: cyan;
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 20px cyan;
}

.enemy {
  width: 40px;
  height: 40px;
  background: red;
  position: absolute;
  top: 0;
  box-shadow: 0 0 15px red;
}

.bullet {
  width: 5px;
  height: 15px;
  background: yellow;
  position: absolute;
}

#score {
  position: absolute;
  top: 10px;
  left: 10px;
}
</style>
</head>
<body>

<div id="score">Skor: 0</div>
<div id="player"></div>

<script>
let player = document.getElementById("player");
let score = 0;
let gameOver = false;

// kontrol
document.addEventListener("keydown", (e) => {
  let left = player.offsetLeft;

  if (e.key === "ArrowLeft" && left > 0) {
    player.style.left = left - 25 + "px";
  }

  if (e.key === "ArrowRight" && left < window.innerWidth - 50) {
    player.style.left = left + 25 + "px";
  }

  if (e.key === " ") shoot();
});

// tembak
function shoot() {
  let bullet = document.createElement("div");
  bullet.classList.add("bullet");

  bullet.style.left = player.offsetLeft + 22 + "px";
  bullet.style.top = player.offsetTop + "px";

  document.body.appendChild(bullet);

  let move = setInterval(() => {
    bullet.style.top = bullet.offsetTop - 10 + "px";

    if (bullet.offsetTop < 0) {
      bullet.remove();
      clearInterval(move);
    }

    // kena musuh
    document.querySelectorAll(".enemy").forEach(enemy => {
      let b = bullet.getBoundingClientRect();
      let e = enemy.getBoundingClientRect();

      if (
        b.top < e.bottom &&
        b.bottom > e.top &&
        b.left < e.right &&
        b.right > e.left
      ) {
        enemy.remove();
        bullet.remove();
        clearInterval(move);
        score++;
        document.getElementById("score").innerText = "Skor: " + score;
      }
    });

  }, 20);
}

// musuh
function spawnEnemy() {
  if (gameOver) return;

  let enemy = document.createElement("div");
  enemy.classList.add("enemy");
  enemy.style.left = Math.random() * (window.innerWidth - 40) + "px";

  document.body.appendChild(enemy);

  let fall = setInterval(() => {
    enemy.style.top = enemy.offsetTop + 4 + "px";

    let p = player.getBoundingClientRect();
    let e = enemy.getBoundingClientRect();

    if (
      e.bottom > p.top &&
      e.top < p.bottom &&
      e.left < p.right &&
      e.right > p.left
    ) {
      gameOver = true;
      alert("💀 Game Over! Skor: " + score);
      location.reload();
    }

    if (enemy.offsetTop > window.innerHeight) {
      enemy.remove();
      clearInterval(fall);
    }
  }, 20);
}

// spawn terus
setInterval(spawnEnemy, 900);
</script>

</body>
  </html>
